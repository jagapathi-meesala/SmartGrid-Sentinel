<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Container Diagram</title>
<desc>SmartGrid Sentinel decomposed into containers: implemented FL server, FL clients, digital twin and model store; planned autonomous response and threat intelligence containers; and an external threat feed actor.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- System boundary -->
<rect x="20" y="20" width="640" height="410" rx="16" fill="#FAFAF7" stroke="#888780" stroke-width="1" stroke-dasharray="7 4"/>
<text x="40" y="44" font-size="14" font-weight="600" fill="#444441">SmartGrid Sentinel System</text>

<!-- Row 1: implemented containers (teal, solid) -->
<rect x="45" y="65" width="140" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="115" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">FL Server</text>
<text x="115" y="106" text-anchor="middle" font-size="11" fill="#085041">Aggregates weights</text>
<text x="115" y="120" text-anchor="middle" font-size="11" fill="#085041">(FedAvg)</text>

<rect x="205" y="65" width="140" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="275" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">FL Client</text>
<text x="275" y="106" text-anchor="middle" font-size="11" fill="#085041">Per substation</text>
<text x="275" y="120" text-anchor="middle" font-size="11" fill="#085041">(3 instances)</text>

<rect x="365" y="65" width="140" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="435" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Digital Twin</text>
<text x="435" y="106" text-anchor="middle" font-size="11" fill="#085041">Simulation engine</text>
<text x="435" y="120" text-anchor="middle" font-size="11" fill="#085041">+ risk scoring</text>

<rect x="525" y="65" width="120" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="585" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Model Store</text>
<text x="585" y="106" text-anchor="middle" font-size="11" fill="#085041">scaler.pkl,</text>
<text x="585" y="120" text-anchor="middle" font-size="11" fill="#085041">.pt checkpoint</text>

<!-- Middle connector labels -->
<line x1="205" y1="92" x2="187" y2="92" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="185" y1="104" x2="203" y2="104" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="365" y1="98" x2="347" y2="98" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="525" y1="98" x2="507" y2="98" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<text x="45" y="155" font-size="11" fill="#5F5E5A">Exchanges weights</text>
<text x="365" y="155" font-size="11" fill="#5F5E5A">Sends alerts / stores model</text>

<!-- Row 2: conceptual containers (gray, dashed) -->
<rect x="45" y="290" width="185" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="137" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">Autonomous Response</text>
<text x="137" y="331" text-anchor="middle" font-size="11" fill="#5F5E5A">Agent(s)</text>
<text x="137" y="347" text-anchor="middle" font-size="11" fill="#5F5E5A">(conceptual)</text>

<rect x="250" y="290" width="185" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="342" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">Threat Intel</text>
<text x="342" y="331" text-anchor="middle" font-size="11" fill="#5F5E5A">Integration Agent</text>
<text x="342" y="347" text-anchor="middle" font-size="11" fill="#5F5E5A">(conceptual)</text>

<rect x="455" y="290" width="185" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="547" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">Threat Intel</text>
<text x="547" y="331" text-anchor="middle" font-size="11" fill="#5F5E5A">Database</text>
<text x="547" y="347" text-anchor="middle" font-size="11" fill="#5F5E5A">(conceptual)</text>

<!-- Arrow: Digital Twin <-> ARA (notifies / issues commands) -->
<path d="M400 131 L400 250 L137 250 L137 288" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
<text x="220" y="245" font-size="11" fill="#888780">Notifies / issues commands (planned)</text>

<!-- Arrow: TII Agent -> TI Database (updates) -->
<line x1="435" y1="325" x2="453" y2="325" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>

<!-- Arrow: TI Database -> Digital Twin (consumes, informs scenario generation) -->
<path d="M547 288 L547 265 L470 265 L470 133" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
<text x="460" y="260" font-size="11" fill="#888780">Informs scenarios (planned)</text>

<!-- External actor: Threat Intel Feeds (outside system boundary) -->
<rect x="250" y="460" width="180" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="340" y="484" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Threat Intel Feeds</text>
<text x="340" y="502" text-anchor="middle" font-size="12" fill="#5F5E5A">External (e.g. MISP)</text>

<path d="M342 360 L342 430 L340 430 L340 458" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
<text x="352" y="430" font-size="11" fill="#888780">Fetches from (planned)</text>

<!-- Legend -->
<rect x="45" y="180" width="20" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="71" y="191" font-size="12" fill="#444441">Implemented</text>
<rect x="185" y="180" width="20" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="5 3"/>
<text x="211" y="191" font-size="12" fill="#444441">Conceptual / future work</text>
</svg>
