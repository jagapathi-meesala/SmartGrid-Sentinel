<text x="215" y="552" text-anchor="middle" font-size="10.5" fill="#4A6483">— not yet implemented</text>

<!-- Threat Intel Integration Agent -->
<rect x="395" y="470" width="300" height="95" rx="6" fill="#FFFFFF" stroke="#438DD5" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="545" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#2E6295">Threat Intel Integration Agent</text>
<text x="545" y="511" text-anchor="middle" font-size="10" font-style="italic" fill="#5B7FA6">[Container: Planned]</text>
<line x1="420" y1="520" x2="670" y2="520" stroke="#C3D9EE" stroke-width="0.8"/>
<text x="545" y="537" text-anchor="middle" font-size="10.5" fill="#4A6483">Fetches external feeds</text>
<text x="545" y="552" text-anchor="middle" font-size="10.5" fill="#4A6483">— not yet implemented</text>

<!-- Threat Intel Database -->
<rect x="725" y="470" width="300" height="95" rx="6" fill="#FFFFFF" stroke="#438DD5" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="875" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#2E6295">Threat Intel Database</text>
<text x="875" y="511" text-anchor="middle" font-size="10" font-style="italic" fill="#5B7FA6">[Container: Planned]</text>
<line x1="750" y1="520" x2="1000" y2="520" stroke="#C3D9EE" stroke-width="0.8"/>
<text x="875" y="537" text-anchor="middle" font-size="10.5" fill="#4A6483">Stores indicators of</text>
<text x="875" y="552" text-anchor="middle" font-size="10.5" fill="#4A6483">compromise — not built</text>

<!-- ═══ External System: Threat Intel Feeds ═══ -->
<rect x="415" y="680" width="260" height="75" rx="6" fill="#686868"/>
<text x="545" y="708" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Threat Intel Feeds</text>
<text x="545" y="724" text-anchor="middle" font-size="10.5" font-style="italic" fill="#DADADA">[Software System]</text>
<text x="545" y="741" text-anchor="middle" font-size="10.5" fill="#E9E9E9">External, e.g. MISP (planned)</text>

<!-- ═══ Relationships: implemented (solid dark) ═══ -->
<!-- Grid Operator -> Dashboard -->
<path d="M150 125 L150 138 L910 138 L910 193" fill="none" stroke="#404040" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="500" y="132" text-anchor="middle" font-size="10.5" fill="#404040">Views alerts &amp; metrics [HTTPS]</text>

<!-- FL Server <-> FL Client -->
<line x1="235" y1="240" x2="253" y2="240" stroke="#404040" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
