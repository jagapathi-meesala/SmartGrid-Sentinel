<text x="340" y="262" text-anchor="middle" font-size="10.5" fill="#F0F6FC">Per-substation local</text>
<text x="340" y="277" text-anchor="middle" font-size="10.5" fill="#F0F6FC">training + inference</text>

<!-- Digital Twin -->
<rect x="445" y="195" width="170" height="95" rx="6" fill="#438DD5" stroke="#2E6295" stroke-width="1.2"/>
<text x="530" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Digital Twin</text>
<text x="530" y="236" text-anchor="middle" font-size="10" font-style="italic" fill="#DCEBFA">[Container: Python]</text>
<line x1="460" y1="245" x2="600" y2="245" stroke="#7EB0E0" stroke-width="0.8"/>
<text x="530" y="262" text-anchor="middle" font-size="10.5" fill="#F0F6FC">Simulation engine +</text>
<text x="530" y="277" text-anchor="middle" font-size="10.5" fill="#F0F6FC">risk scoring</text>

<!-- Model Store -->
<rect x="635" y="195" width="170" height="95" rx="6" fill="#438DD5" stroke="#2E6295" stroke-width="1.2"/>
<text x="720" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Model Store</text>
<text x="720" y="236" text-anchor="middle" font-size="10" font-style="italic" fill="#DCEBFA">[Container: File system]</text>
<line x1="650" y1="245" x2="790" y2="245" stroke="#7EB0E0" stroke-width="0.8"/>
<text x="720" y="262" text-anchor="middle" font-size="10.5" fill="#F0F6FC">scaler.pkl,</text>
<text x="720" y="277" text-anchor="middle" font-size="10.5" fill="#F0F6FC">.pt checkpoint</text>

<!-- Dashboard -->
<rect x="825" y="195" width="170" height="95" rx="6" fill="#438DD5" stroke="#2E6295" stroke-width="1.2"/>
<text x="910" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Dashboard</text>
<text x="910" y="236" text-anchor="middle" font-size="10" font-style="italic" fill="#DCEBFA">[Container: Streamlit]</text>
<line x1="840" y1="245" x2="980" y2="245" stroke="#7EB0E0" stroke-width="0.8"/>
<text x="910" y="262" text-anchor="middle" font-size="10.5" fill="#F0F6FC">Live alerts,</text>
<text x="910" y="277" text-anchor="middle" font-size="10.5" fill="#F0F6FC">FL + twin metrics</text>

<!-- ═══ Row 2: planned containers (dashed, unfilled) ═══ -->
<!-- Autonomous Response Agent -->
<rect x="65" y="470" width="300" height="95" rx="6" fill="#FFFFFF" stroke="#438DD5" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="215" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#2E6295">Autonomous Response Agent(s)</text>
<text x="215" y="511" text-anchor="middle" font-size="10" font-style="italic" fill="#5B7FA6">[Container: Planned]</text>
<line x1="90" y1="520" x2="340" y2="520" stroke="#C3D9EE" stroke-width="0.8"/>
