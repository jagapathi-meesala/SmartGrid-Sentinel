<!-- Digital Twin -> Smart Grid Infrastructure (routed above row1, clear of all boxes) -->
<path d="M600 195 L600 165 L1000 165 L1000 125" fill="none" stroke="#404040" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="800" y="158" text-anchor="middle" font-size="10" fill="#404040">Simulates traffic from / responses to</text>

<!-- FL Server -> Model Store (lane A, y=315) -->
<path d="M150 290 L150 315 L720 315 L720 293" fill="none" stroke="#404040" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="300" y="308" text-anchor="middle" font-size="10.5" fill="#404040">Stores global model [file write]</text>

<!-- Digital Twin -> Dashboard (lane B, y=345) -->
<path d="M500 290 L500 345 L910 345 L910 293" fill="none" stroke="#404040" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="790" y="338" text-anchor="middle" font-size="10.5" fill="#404040">Streams risk scores &amp; alerts [JSON]</text>

<!-- Digital Twin <-> ARA (lane C, y=375, planned) -->
<path d="M560 290 L560 375 L215 375 L215 468" fill="none" stroke="#438DD5" stroke-width="1.2" stroke-dasharray="5 3" marker-start="url(#arrow-p)" marker-end="url(#arrow-p)"/>
<text x="340" y="368" text-anchor="middle" font-size="10" fill="#438DD5">Notifies / issues commands (planned)</text>

<!-- TII Agent -> TI Database (planned, direct short arrow, row 2) -->
<line x1="695" y1="517" x2="723" y2="517" stroke="#438DD5" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-p)"/>
<text x="709" y="463" text-anchor="middle" font-size="9" fill="#438DD5">Updates</text>

<!-- TI Database -> Digital Twin (lane D, y=405, planned) -->
<path d="M900 470 L900 405 L620 405 L620 293" fill="none" stroke="#438DD5" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-p)"/>
<text x="790" y="398" text-anchor="middle" font-size="10" fill="#438DD5">Informs scenario generation (planned)</text>

<!-- TII Agent -> Threat Intel Feeds -->
<line x1="545" y1="565" x2="545" y2="678" stroke="#438DD5" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-p)"/>
<text x="620" y="625" text-anchor="middle" font-size="10" fill="#438DD5">Fetches from (planned)</text>

<!-- ═══ Legend ═══ -->
<rect x="40" y="765" width="24" height="18" rx="3" fill="#438DD5" stroke="#2E6295"/>
<text x="72" y="778" font-size="11.5" fill="#2C2C2A">Implemented</text>
<rect x="200" y="765" width="24" height="18" rx="3" fill="#FFFFFF" stroke="#438DD5" stroke-dasharray="5 3"/>
<text x="232" y="778" font-size="11.5" fill="#2C2C2A">Planned / not yet built</text>
<rect x="400" y="765" width="24" height="18" rx="3" fill="#686868"/>
<text x="432" y="778" font-size="11.5" fill="#2C2C2A">External system / person</text>
