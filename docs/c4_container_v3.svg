<text x="100" y="312" text-anchor="middle" font-size="9" fill="#404040">[gRPC]</text>

<!-- FL Client -> Digital Twin -->
<line x1="425" y1="240" x2="443" y2="240" stroke="#404040" stroke-width="1.3" marker-end="url(#arrow)"/>
