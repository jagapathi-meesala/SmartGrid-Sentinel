<svg width="1100" height="800" viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>SmartGrid Sentinel — C4 Container Diagram</title>
<rect x="0" y="0" width="1100" height="800" fill="#FFFFFF"/>


<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L8 5L1 9" fill="none" stroke="#404040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L8 5L1 9" fill="none" stroke="#438DD5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="550" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1E1E1C">SmartGrid Sentinel — C4 Container Diagram</text>

<!-- ═══ Person: Grid Operator ═══ -->
<rect x="40" y="45" width="220" height="80" rx="6" fill="#08427B"/>
<text x="150" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Grid Operator</text>
<text x="150" y="89" text-anchor="middle" font-size="10.5" font-style="italic" fill="#CBD9E8">[Person]</text>
<text x="150" y="108" text-anchor="middle" font-size="10.5" fill="#E8EEF6">Monitors alerts, reviews model metrics</text>

<!-- ═══ External System: Smart Grid Infrastructure ═══ -->
<rect x="840" y="45" width="220" height="80" rx="6" fill="#686868"/>
<text x="950" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Smart Grid Infrastructure</text>
<text x="950" y="89" text-anchor="middle" font-size="10.5" font-style="italic" fill="#DADADA">[Software System]</text>
<text x="950" y="108" text-anchor="middle" font-size="10.5" fill="#E9E9E9">Substations, IoT devices</text>

<!-- ═══ System boundary ═══ -->
<rect x="40" y="150" width="1020" height="445" rx="14" fill="#FAFBFC" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="8 5"/>
<text x="60" y="175" font-size="13" font-weight="700" fill="#4A4A4A">SmartGrid Sentinel System [Software System boundary]</text>

<!-- ═══ Row 1: implemented containers (solid blue) ═══ -->
<!-- FL Server -->
<rect x="65" y="195" width="170" height="95" rx="6" fill="#438DD5" stroke="#2E6295" stroke-width="1.2"/>
<text x="150" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">FL Server</text>
<text x="150" y="236" text-anchor="middle" font-size="10" font-style="italic" fill="#DCEBFA">[Container: Python]</text>
<line x1="80" y1="245" x2="220" y2="245" stroke="#7EB0E0" stroke-width="0.8"/>
<text x="150" y="262" text-anchor="middle" font-size="10.5" fill="#F0F6FC">FedAvg aggregation,</text>
<text x="150" y="277" text-anchor="middle" font-size="10.5" fill="#F0F6FC">10 rounds</text>

<!-- FL Client -->
<rect x="255" y="195" width="170" height="95" rx="6" fill="#438DD5" stroke="#2E6295" stroke-width="1.2"/>
<text x="340" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">FL Client</text>
<text x="340" y="236" text-anchor="middle" font-size="10" font-style="italic" fill="#DCEBFA">[Container: Python, x3]</text>
