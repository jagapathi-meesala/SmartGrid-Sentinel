<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>System Context Diagram</title>
<desc>SmartGrid Sentinel system context showing the Grid Operator, the system itself, Smart Grid Infrastructure, and a planned Threat Intelligence integration.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Grid Operator (person) -->
<rect x="40" y="40" width="180" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="130" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Grid Operator</text>
<text x="130" y="82" text-anchor="middle" font-size="12" fill="#3C3489">Person</text>

<!-- SmartGrid Sentinel System (main, center) -->
<rect x="250" y="160" width="220" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="360" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">SmartGrid Sentinel</text>
<text x="360" y="206" text-anchor="middle" font-size="12" fill="#085041">Federated IDS + digital twin</text>
<text x="360" y="222" text-anchor="middle" font-size="11" fill="#0F6E56">(this system)</text>

<!-- Smart Grid Infrastructure (real external system) -->
<rect x="460" y="40" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="550" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">Smart Grid Infra.</text>
<text x="550" y="82" text-anchor="middle" font-size="12" fill="#0C447C">Substations, IoT devices</text>

<!-- External Threat Intel Feeds (planned / conceptual - dashed) -->
<rect x="460" y="320" width="180" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="550" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Threat Intel Feeds</text>
<text x="550" y="362" text-anchor="middle" font-size="12" fill="#5F5E5A">e.g. MISP (planned)</text>

<!-- Arrows -->
<line x1="150" y1="100" x2="290" y2="160" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="150" y="130" font-size="12" fill="#5F5E5A">Monitors &amp;</text>
<text x="150" y="144" font-size="12" fill="#5F5E5A">interacts with</text>

<line x1="470" y1="188" x2="458" y2="80" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="478" y="130" font-size="12" fill="#5F5E5A">Monitors traffic from /</text>
<text x="478" y="144" font-size="12" fill="#5F5E5A">sends response cmds</text>

<line x1="450" y1="230" x2="462" y2="332" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
<text x="478" y="280" font-size="12" fill="#888780">Consumes</text>
<text x="478" y="294" font-size="12" fill="#888780">(planned)</text>

<!-- Legend -->
<rect x="40" y="400" width="20" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="66" y="411" font-size="12" fill="#444441">Implemented</text>
<rect x="180" y="400" width="20" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="5 3"/>
<text x="206" y="411" font-size="12" fill="#444441">Planned / not yet integrated</text>
</svg>
