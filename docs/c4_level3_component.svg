<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Digital Twin Component Diagram</title>
<desc>Internal components of the Digital Twin Simulation Engine, showing implemented logic and two conceptual components not yet built, with an external reference to the FL Client Application.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- External reference: FL Client Application -->
<rect x="147" y="20" width="180" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="237" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">FL Client Application</text>
<text x="237" y="57" text-anchor="middle" font-size="11" fill="#5F5E5A">(external container, Level 2)</text>

<!-- Boundary -->
<rect x="20" y="90" width="640" height="340" rx="16" fill="#FAFAF7" stroke="#888780" stroke-width="1" stroke-dasharray="7 4"/>
<text x="40" y="114" font-size="14" font-weight="600" fill="#444441">Digital Twin Simulation Engine</text>

<!-- Row 1: implemented (teal) -->
<rect x="45" y="130" width="180" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="135" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Network Traffic</text>
<text x="135" y="171" text-anchor="middle" font-size="12" fill="#04342C">Generator</text>
<text x="135" y="188" text-anchor="middle" font-size="11" fill="#085041">Samples real flows</text>

<rect x="250" y="130" width="180" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Substation</text>
<text x="340" y="171" text-anchor="middle" font-size="12" fill="#04342C">Simulator</text>
<text x="340" y="188" text-anchor="middle" font-size="11" fill="#085041">Per-tick state</text>

<rect x="455" y="130" width="180" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="545" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Grid State</text>
<text x="545" y="171" text-anchor="middle" font-size="12" fill="#04342C">Manager</text>
<text x="545" y="188" text-anchor="middle" font-size="11" fill="#085041">Tracks tick history</text>

<!-- Row 2: implemented (teal) + one conceptual (gray dashed) -->
<rect x="45" y="260" width="180" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="135" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Attack Scenario</text>
<text x="135" y="301" text-anchor="middle" font-size="12" fill="#04342C">Manager</text>
<text x="135" y="318" text-anchor="middle" font-size="11" fill="#085041">Injects at scheduled ticks</text>

<rect x="250" y="260" width="180" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Event / Alert</text>
<text x="340" y="301" text-anchor="middle" font-size="12" fill="#04342C">Handler</text>
<text x="340" y="318" text-anchor="middle" font-size="11" fill="#085041">Dynamic risk threshold</text>

<rect x="455" y="260" width="180" height="66" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="545" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">Response Action</text>
<text x="545" y="301" text-anchor="middle" font-size="12" fill="#444441">Executor</text>
<text x="545" y="318" text-anchor="middle" font-size="11" fill="#5F5E5A">(conceptual)</text>

<!-- Row 3: conceptual (gray dashed) -->
<rect x="250" y="350" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="340" y="374" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">Threat Intel Adapter</text>
<text x="340" y="392" text-anchor="middle" font-size="11" fill="#5F5E5A">(conceptual)</text>

<!-- Arrows: implemented -->
<line x1="225" y1="163" x2="248" y2="163" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="228" y="150" font-size="10" fill="#5F5E5A">Feeds traffic</text>

<line x1="455" y1="163" x2="432" y2="163" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="425" y="150" font-size="10" fill="#5F5E5A">Informs</text>

<line x1="135" y1="260" x2="135" y2="198" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="140" y="230" font-size="10" fill="#5F5E5A">Instructs</text>

<line x1="430" y1="293" x2="453" y2="293" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- External arrow: FL Client -> Event/Alert Handler, threaded through the row-1 column gap -->
<path d="M237 70 L237 196 L280 260" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="245" y="225" font-size="10" fill="#5F5E5A">Sends detection alerts</text>

<!-- Conceptual arrows (dashed) -->
<line x1="545" y1="260" x2="545" y2="198" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
<text x="550" y="230" font-size="10" fill="#888780">Modifies (planned)</text>

<path d="M270 350 L270 335 L135 335 L135 328" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
<text x="150" y="345" font-size="10" fill="#888780">Updates scenarios (planned)</text>

<!-- Legend -->
<rect x="45" y="450" width="20" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="71" y="461" font-size="12" fill="#444441">Implemented (within one module)</text>
<rect x="330" y="450" width="20" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="5 3"/>
<text x="356" y="461" font-size="12" fill="#444441">Conceptual / future work</text>
</svg>
